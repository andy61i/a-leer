<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¡A leer! — aprender a leer en español</title>
<style>
  :root{
    --bg1:#fff7e6; --bg2:#ffe9f3; --ink:#2b2b3a; --card:#ffffff;
    --green:#27c267; --green-d:#1ea957; --blue:#2e8bff; --orange:#ff9f1c;
    --pink:#ff5fa2; --purple:#9b5de5; --gold:#ffc93c;
    --shadow:0 10px 30px rgba(0,0,0,.12);
    --r:26px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Comic Sans MS","Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink); background:linear-gradient(160deg,var(--bg1),var(--bg2)); overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }
  .screen{position:fixed; inset:0; display:none; flex-direction:column; padding:14px; gap:12px;}
  .screen.active{display:flex;}

  /* ---------- Top bar ---------- */
  .topbar{display:flex; align-items:center; gap:10px; flex:0 0 auto;
          width:100%; max-width:680px; margin:0 auto;}
  .topbar .spacer{flex:1;}
  .chip{background:#fff; border:none; border-radius:999px; padding:10px 18px; font-size:clamp(16px,4vw,22px);
        font-weight:800; box-shadow:var(--shadow); color:var(--ink); white-space:nowrap;}
  .chip.cups{color:var(--orange);}
  .big-btn{border:none; border-radius:var(--r); padding:22px 40px; font-size:clamp(22px,5vw,34px);
           font-weight:800; color:#fff; background:var(--green); box-shadow:var(--shadow); cursor:pointer;
           transition:transform .08s; font-family:inherit;}
  .big-btn:active{transform:scale(.95);}
  .big-btn.alt{background:#fff; color:var(--purple);}

  /* The adult's corner: small on purpose, and it only opens on a long press. */
  .gear{width:44px; height:44px; border-radius:50%; border:none; background:#fff; box-shadow:var(--shadow);
        font-size:20px; opacity:.6; cursor:pointer; flex:0 0 auto;}
  .gear.corner{position:absolute; right:14px; bottom:14px;}
  .backbtn{border:none; border-radius:var(--r); padding:14px 22px; min-height:56px; font-family:inherit;
           font-size:clamp(18px,4.5vw,22px); font-weight:800; color:#fff; background:var(--blue);
           box-shadow:var(--shadow); cursor:pointer; transition:transform .08s; flex:0 0 auto;}
  .backbtn:active{transform:scale(.95);}
  .lvlname{font-size:clamp(16px,4vw,20px); font-weight:800; color:var(--purple); white-space:nowrap;}

  /* ---------- Level map ---------- */
  #map{align-items:center; justify-content:center; gap:10px;}
  #map h1{font-size:clamp(28px,7vw,52px); margin:2px 0 0; color:var(--pink); text-shadow:2px 3px 0 #fff;
          text-align:center;}
  /* The column count follows the width: 5 on a wide screen, 3 on a narrow phone,
     where the percentage floor overrides the pixel one so 15 tiles still fit. */
  #map .grid{flex:0 1 auto; min-height:0; overflow:auto; display:grid; width:100%; max-width:680px;
             margin:0 auto; grid-template-columns:repeat(auto-fill,minmax(min(108px,28%),1fr)); gap:12px;
             padding:6px; align-content:start;}
  .lvltile{aspect-ratio:1/1; background:#fff; border:none; border-radius:20px; box-shadow:var(--shadow);
           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
           cursor:pointer; font-family:inherit; transition:transform .08s;}
  .lvltile:active{transform:scale(.95);}
  .lvltile .num{font-size:clamp(20px,5vw,28px); font-weight:800; color:var(--purple);}
  .lvltile .mark{font-size:clamp(26px,6vw,40px); line-height:1;}
  .lvltile.won .mark{animation:sway 3s ease-in-out infinite;}
  .lvltile.locked{filter:grayscale(1); opacity:.45; cursor:default;}
  /* The level the child stopped at: a ring so a five-year-old sees where to tap. */
  .lvltile.next{animation:ring 1.8s ease-in-out infinite;}
  @keyframes ring{0%,100%{box-shadow:0 0 0 4px var(--green), var(--shadow)}
                  50%{box-shadow:0 0 0 9px rgba(39,194,103,.4), var(--shadow)}}

  /* ---------- Game card ---------- */
  #game{align-items:center;}
  .stage{flex:1 1 auto; min-height:0; width:100%; max-width:680px; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:14px;}
  .picwrap{position:relative; flex:0 1 auto; min-height:0; height:min(70vw,46vh,380px); aspect-ratio:1/1;
           border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; background:#fff;}
  .picwrap .emoji{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                  font-size:min(40vw,26vh,210px);}
  .picwrap img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none;}
  .tiles{position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);}
  .tile{background:linear-gradient(135deg,#b39ddb,#9b5de5); border:2px solid #fff; transition:opacity .45s, transform .45s;}
  .tile.gone{opacity:0; transform:scale(.4); pointer-events:none;}

  .word{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; flex:0 0 auto;}
  .syl{font-size:clamp(40px,13vw,104px); font-weight:800; color:#fff; padding:.06em .26em; border-radius:18px;
       line-height:1; box-shadow:var(--shadow); cursor:pointer; transition:transform .12s;
       text-transform:uppercase; letter-spacing:.02em;}
  /* The size of a game syllable follows the length of the word: JS sets --wlen to the
     width the word needs, in em, and the rule divides the usable width by it. The
     usable width is the stage, not the window: the stage stops at 680px, so dividing
     the viewport would let a long word overflow it on a wide screen. The rule is
     scoped to #word so it cannot shrink a .syl used anywhere else. */
  #word .syl{font-size:clamp(26px, calc(min(92vw, 660px) / var(--wlen,8)), 104px);}
  #word .dot{font-size:clamp(18px, calc(min(52vw, 370px) / var(--wlen,8)), 60px); color:#bbb; font-weight:800;}
  .syl.bounce{animation:bounce .5s;}
  @keyframes bounce{0%{transform:translateY(0)}30%{transform:translateY(-26px) scale(1.08)}60%{transform:translateY(0)}80%{transform:translateY(-8px)}100%{transform:translateY(0)}}

  .cheer{font-size:clamp(22px,6vw,44px); font-weight:800; color:var(--green-d); min-height:1.2em; flex:0 0 auto;}

  .controls{display:flex; gap:14px; width:100%; max-width:680px; justify-content:center; flex-wrap:wrap;
            padding-bottom:6px; flex:0 0 auto;}
  .ctrl{border:none; border-radius:var(--r); padding:18px 22px; font-size:clamp(18px,4.5vw,26px);
        font-weight:800; color:#fff; box-shadow:var(--shadow); cursor:pointer; transition:transform .08s; min-width:150px;}
  .ctrl:active{transform:scale(.95);}
  .ctrl.hint{background:var(--orange);}
  .ctrl.read{background:var(--green);}
  .ctrl.next{background:var(--blue);}
  .ctrl[disabled]{opacity:.4; cursor:default;}
  .parent-note{font-size:12px; opacity:.55; width:100%; text-align:center; margin-top:-4px; flex:0 0 auto;}

  /* One segment per word of the level: the child sees how many words are left
     instead of reading a fraction off a smooth bar. */
  .levelbar{width:min(70vw,380px); height:14px; display:flex; gap:4px; flex:0 0 auto;}
  .levelbar .seg{flex:1 1 0; background:#fff; border-radius:999px; box-shadow:var(--shadow);
                 transition:background .35s;}
  .levelbar .seg.on{background:linear-gradient(180deg,var(--green),var(--green-d));}

  /* ---------- Trophy screen ---------- */
  #trophy{align-items:center; justify-content:center; text-align:center; gap:18px;}
  .rays{position:absolute; left:50%; top:50%; width:220vmax; height:220vmax; pointer-events:none;
        background:repeating-conic-gradient(from 0deg, rgba(255,201,60,.32) 0 5deg, transparent 5deg 22deg);
        animation:spin 16s linear infinite; opacity:0;}
  .rays.on{opacity:1; transition:opacity .8s;}
  @keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
  .cup{position:relative; font-size:min(46vw,34vh,260px); line-height:1; transform:scale(0);}
  .cup.pop{animation:pop 1s cubic-bezier(.2,1.6,.4,1) forwards;}
  @keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.15) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #trophy .head{position:relative; font-size:clamp(26px,7vw,48px); font-weight:800; color:var(--purple); opacity:0;}
  #trophy .head.on{opacity:1; transition:opacity .5s;}
  .unlock{position:relative; font-size:clamp(18px,4.5vw,26px); font-weight:700; color:var(--green-d);
          display:flex; align-items:center; gap:10px; opacity:0;}
  .unlock.on{opacity:1; transition:opacity .5s;}
  .unlock .lock{font-size:1.6em; display:inline-block;}
  .unlock .lock.shake{animation:shake .7s;}
  @keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
  #trophy .row{position:relative; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; opacity:0;}
  #trophy .row.on{opacity:1; transition:opacity .5s;}

  @keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

  /* ---------- Adult's panel ---------- */
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:30;}
  .sheet-bg.open{display:block;}
  /* Centred, not pinned to a window edge: the panel used to drift far from its button. */
  .sheet{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
         background:#fff; border-radius:20px; box-shadow:var(--shadow);
         padding:16px; width:min(340px,90vw); max-height:80vh; overflow:auto;
         display:flex; flex-direction:column; gap:10px;}
  .sheet h3{margin:4px 0; font-size:15px; color:var(--purple); text-transform:uppercase; letter-spacing:.5px;}
  .pillrow{display:flex; gap:8px; flex-wrap:wrap;}
  .pill{border:2px solid #eee; background:#fff; border-radius:999px; padding:8px 14px; font-size:15px;
        font-weight:700; cursor:pointer;}
  .sheet .danger{color:#d33; border-color:#f3c6c6;}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:700;}
  .hintline{font-size:12px; opacity:.6; line-height:1.35;}

  #confetti{position:fixed; inset:0; pointer-events:none; z-index:40;}
</style>
</head>
<body>

<!-- ================= LEVEL MAP ================= -->
<section id="map" class="screen active">
  <h1 id="greet">¡Hola! 🌟</h1>
  <span class="chip cups">🏆 <span id="cupCount">0</span>/15</span>
  <div class="grid" id="mapGrid"></div>
  <div class="hintline">Un nivel con 🔒 se abre con el trofeo del nivel anterior.
    El adulto puede abrirlo igual: mantén el dedo sobre el candado. El ⚙️ se abre así también.</div>
  <button class="gear corner" id="gearMap">⚙️</button>
</section>

<!-- ================= GAME ================= -->
<section id="game" class="screen">
  <div class="topbar">
    <button class="backbtn" onclick="backToMap()">🗺️ Niveles</button>
    <div class="spacer"></div>
    <span class="lvlname" id="levelChip">Nivel 1</span>
    <button class="gear" id="gearGame">⚙️</button>
  </div>

  <div class="stage">
    <div class="picwrap" id="picwrap">
      <div class="emoji" id="emoji">🐻</div>
      <img id="pic" alt="">
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="word" id="word"></div>
    <div class="cheer" id="cheer"></div>
    <div class="levelbar" id="levelbar"></div>
  </div>

  <div class="parent-note">💡 Pista — para quien lee &nbsp;·&nbsp; ✅ y → — para el adulto</div>
  <div class="controls">
    <button class="ctrl hint" id="btnHint" onclick="giveHint()">Pista 💡</button>
    <button class="ctrl read" id="btnRead" onclick="markRead()">¡Lo leyó! ✅</button>
    <button class="ctrl next" id="btnNext" onclick="nextWord()" style="display:none">Siguiente →</button>
  </div>
</section>

<!-- ================= TROPHY ================= -->
<section id="trophy" class="screen">
  <div class="rays" id="rays"></div>
  <div class="cup" id="cup">🏆</div>
  <div class="head" id="trophyHead">¡Nivel completado!</div>
  <div class="unlock" id="trophyUnlock"><span class="lock" id="trophyLock">🔒</span><span id="trophyUnlockText"></span></div>
  <div class="row" id="trophyRow">
    <button class="big-btn alt" onclick="backToMap()">🗺️ Niveles</button>
    <button class="big-btn" id="trophyGo" onclick="afterTrophy()">Seguir →</button>
  </div>
</section>

<!-- ================= ADULT'S PANEL ================= -->
<div class="sheet-bg" id="sheetBg" onclick="closeTools(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <h3>Modo</h3>
    <label class="toggle"><span>Ver el dibujo desde el inicio 🖼️</span>
      <input type="checkbox" id="easyMode" onchange="toggleEasy()" style="width:26px;height:26px"></label>
    <h3>Otros</h3>
    <div class="pillrow">
      <button class="pill danger" onclick="resetProgress()">Borrar progreso 🗑️</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

  {w:'león', syl:['le','ón'], em:'🦁', lvl:15},
  {w:'avión', syl:['a','vión'], em:'✈️', lvl:15},
  {w:'lápiz', syl:['lá','piz'], em:'✏️', lvl:15},
  {w:'plátano', syl:['plá','ta','no'], em:'🍌', lvl:15},
  {w:'marrón', syl:['ma','rrón'], em:'🟤', lvl:15},
  {w:'teléfono', syl:['te','lé','fo','no'], em:'☎️', lvl:15},
];
const PALETTE = ['#ff5252','#2e8bff','#27c267','#ff9f1c','#9b5de5','#00bcd4'];
const LEVELS = 15;
const TROPHIES = ['🏆','🥇','👑','🚀','⭐','🎖️','💎','🌟','🎁','🎨','🦄','🌈','🎯','🏅','🎪'];

/* =================== STATE =================== */
const STORE = 'aleer_v2';
const OLD_KEY = /^aleer_.*_v1$/;

function blank(){ return {stars:{}, hints:{}, trophies:[]}; }
function norm(p){
  const b = blank();
  return {stars:p.stars||b.stars, hints:p.hints||b.hints,
          trophies:Array.isArray(p.trophies)?p.trophies:[]};
}
/* Levels whose every word already carries a star. Used once, when progress moves
   from the old key: without it a level could show a full bar and no trophy, and
   the next level would stay locked with no way left to open it. */
function starredLevels(stars){
  const out=[];
  for(let l=1;l<=LEVELS;l++){
    const lw=levelWords(l);
    if(lw.length && lw.every(x=>(stars[x.w]||0)>0)) out.push(l);
  }
  return out;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(raw) return norm(JSON.parse(raw));
  }catch(e){}
  /* The previous key carried a name, so it is found by shape, never spelled out. */
  try{
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!OLD_KEY.test(k)) continue;
      const old = norm(JSON.parse(localStorage.getItem(k)||'{}'));
      old.trophies = starredLevels(old.stars);
      /* Write first, delete after, and hand the progress back either way: if the
         browser refuses the write, the old key stays and the child keeps the
         stars — starting from a blank progress here would lose them for good. */
      try{
        localStorage.setItem(STORE, JSON.stringify(old));
        localStorage.removeItem(k);
      }catch(e){}
      return old;
    }
  }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(prog)); }catch(e){} }

let prog = load();
let curLevel = 1;
let easy = false;                 /* deliberately not stored: it helps on a hard day only */
let queue = [], qi = 0, current = null, hintsThisWord = 0;
let circle = new Set();           /* words read since this lap started */
let circleLevel = null;           /* the level that lap belongs to */
let pendingTrophy = false;
let lapTimer = null;              /* delayed "lap complete" line, cancelled on the next word */

/* =================== HELPERS =================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function onScreen(id){ return document.getElementById(id).classList.contains('active'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function levelWords(lvl){ return WORDS.filter(x=>x.lvl===lvl); }
function hasTrophy(l){ return prog.trophies.indexOf(l)>=0; }
function unlocked(l){ return l===1 || hasTrophy(l-1); }
function firstOpenLevel(){
  for(let l=1;l<=LEVELS;l++) if(!hasTrophy(l)) return l;
  return 1;
}
function pick(a){ return a[Math.random()*a.length|0]; }

/* =================== AUDIO (no files) =================== */
let actx=null;
function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq,start,dur,type='sine',vol=.25){
  const a=audio(), o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
  const t=a.currentTime+start;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.start(t); o.stop(t+dur+.02);
}
function playPop(){ tone(520,0,.12,'triangle',.2); tone(780,.05,.12,'triangle',.18); }
function playSuccess(){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.09,.22,'triangle',.22)); }
function playFanfare(){ [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,i*.12,.3,'square',.18)); }
function playTrophy(){
  [523,659,784,1046,1318,1046,1318,1568].forEach((f,i)=>tone(f,i*.13,.34,'square',.18));
  [262,330,392,523].forEach((f,i)=>tone(f,i*.13,.5,'triangle',.12));
  tone(2093,1.1,.9,'triangle',.16);
}
function playUnlock(){ tone(880,0,.09,'square',.16); tone(1320,.1,.16,'square',.16); }

/* =================== IMAGES =================== */
const EXT = ['webp','png','jpg','jpeg'];
let imgToken = 0;
function loadImage(imgEl, emojiEl, word){
  /* Each call takes a token. A probe that finishes after the child moved on
     belongs to the previous word, and putting its picture up would show a bear
     over the word "mesa". */
  const token = ++imgToken;
  let i=0;
  imgEl.style.display='none'; emojiEl.style.display='flex';
  (function tryNext(){
    if(i>=EXT.length || token!==imgToken) return;
    const url='images/'+word+'.'+EXT[i++];
    const probe=new Image();
    probe.onload=()=>{ if(token!==imgToken) return;
      imgEl.src=url; imgEl.style.display='block'; emojiEl.style.display='none'; };
    probe.onerror=tryNext;
    probe.src=url;
  })();
}

/* =================== NAVIGATION =================== */
/* The game keeps its own history so the browser's back button lands on the map
   instead of leaving the site. The map is always the bottom of the stack, a
   level sits one entry above it, and the party rides on the level's entry —
   giving the party an entry of its own would let "forward" congratulate the
   child for a level they have since erased. */
function openMap(){ show('map'); renderMap(); }
function goLevel(l){ history.pushState({screen:'game', level:l}, ''); startLevel(l); }
function backToMap(){ history.back(); }
addEventListener('popstate', e=>{
  const st = e.state || {screen:'map'};
  /* An entry can outlive the level it points at: "Borrar progreso" closes the
     locks again, and the browser's forward button would otherwise walk the child
     straight past one. Step back onto the map entry that always sits under a
     level entry — rewriting this one instead would leave two maps in a row. */
  if(st.screen==='game' && !unlocked(st.level)){ history.back(); return; }
  if(st.screen==='game') startLevel(st.level); else openMap();
});

/* =================== LEVEL MAP =================== */
function renderMap(){
  const grid=document.getElementById('mapGrid'); grid.innerHTML='';
  document.getElementById('cupCount').textContent=prog.trophies.length;
  /* No ring once every cup is won: firstOpenLevel() falls back to 1, and a ring
     there would point the child at a level they have already finished. */
  const next=prog.trophies.length<LEVELS ? firstOpenLevel() : 0;
  for(let l=1;l<=LEVELS;l++){
    const won=hasTrophy(l), open=unlocked(l);
    const b=document.createElement('button');
    b.className='lvltile'+(won?' won':'')+(open?'':' locked')+(l===next?' next':'');
    const num=document.createElement('span'); num.className='num'; num.textContent=l;
    const mark=document.createElement('span'); mark.className='mark';
    mark.textContent = won ? TROPHIES[l-1] : (open ? '' : '🔒');
    b.appendChild(mark); b.appendChild(num);
    if(open) b.onclick=()=>goLevel(l);
    else holdTo(b, ()=>{ playUnlock(); goLevel(l); });
    grid.appendChild(b);
  }
}

/* =================== GAME FLOW =================== */
function startLevel(l){
  curLevel = l;
  show('game');
  /* The lap survives a trip to the map and back: it is only reset when the
     child actually moves to another level. */
  if(circleLevel !== curLevel){ circle = new Set(); circleLevel = curLevel; }
  pendingTrophy = false;
  buildQueue();
  nextWord();
}
function buildQueue(){
  const list = levelWords(curLevel);
  const extra = list.filter(x=>(prog.hints[x.w]||0)>0);
  queue = shuffle(list.concat(extra));
  qi = 0;
}
function nextWord(){
  if(pendingTrophy){ showTrophy(); return; }
  if(qi>=queue.length) buildQueue();
  current = queue[qi++];
  hintsThisWord = 0;
  renderWord();
}
function renderWord(){
  clearTimeout(lapTimer); lapTimer=null;
  const wEl=document.getElementById('word'); wEl.innerHTML='';
  /* Width the word needs, in em: syllable letters plus their padding plus the dots.
     The CSS divides the usable width by it, so a long word simply gets smaller
     letters instead of wrapping and pushing the buttons off the screen. */
  let units=0;
  current.syl.forEach((s,i)=>{
    units += s.length*0.70 + 0.62;
    if(i<current.syl.length-1) units += 0.54;
    const span=document.createElement('span');
    span.className='syl'; span.textContent=s;
    span.style.background=PALETTE[i%PALETTE.length];
    span.onclick=()=>{ span.classList.remove('bounce'); void span.offsetWidth; span.classList.add('bounce'); playPop(); };
    wEl.appendChild(span);
    if(i<current.syl.length-1){
      const dot=document.createElement('span'); dot.className='dot'; dot.textContent='·'; wEl.appendChild(dot);
    }
  });
  wEl.style.setProperty('--wlen', units.toFixed(2));

  document.getElementById('emoji').textContent=current.em;
  loadImage(document.getElementById('pic'), document.getElementById('emoji'), current.w);
  buildTiles();
  document.getElementById('cheer').textContent='';
  document.getElementById('btnHint').style.display='';
  document.getElementById('btnRead').style.display='';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('btnHint').disabled=false;
  if(easy) revealAll();
  updateLevelBar();
  document.getElementById('levelChip').textContent='Nivel '+curLevel;
}
let tileOrder=[];
function buildTiles(){
  const t=document.getElementById('tiles'); t.innerHTML='';
  for(let i=0;i<9;i++){ const d=document.createElement('div'); d.className='tile'; t.appendChild(d); }
  tileOrder = shuffle([...Array(9).keys()]);
  t.style.display = easy ? 'none' : 'grid';
}
function giveHint(){
  const tiles=document.getElementById('tiles').children;
  const covered=tileOrder.filter(i=>!tiles[i].classList.contains('gone'));
  if(covered.length<=1) document.getElementById('btnHint').disabled=true;
  if(covered.length){ tiles[covered[0]].classList.add('gone'); playPop(); hintsThisWord++; }
}
function revealAll(){
  const tiles=document.getElementById('tiles').children;
  [...tiles].forEach((t,k)=>setTimeout(()=>t.classList.add('gone'), k*40));
}
function markRead(){
  revealAll();
  prog.stars[current.w]=(prog.stars[current.w]||0)+1;
  if(hintsThisWord>0) prog.hints[current.w]=(prog.hints[current.w]||0)+1;
  circle.add(current.w);

  const lw=levelWords(curLevel);
  /* The trophy follows the stored stars, not this lap: a child may need two
     sittings to close a level, and the lap starts empty after a reload. The lap
     only drives the fanfare of a repeated full round. */
  const levelDone = lw.length && lw.every(x=>(prog.stars[x.w]||0)>0);
  const lapDone = lw.length && lw.every(x=>circle.has(x.w));
  const wonNow = levelDone && !hasTrophy(curLevel);
  /* The trophy is stored right here, not on the party screen: leaving the game
     before "Siguiente" must not cost the child the level they just finished. */
  if(wonNow) prog.trophies.push(curLevel);
  save(); updateLevelBar();

  document.getElementById('btnHint').style.display='none';
  document.getElementById('btnRead').style.display='none';
  document.getElementById('btnNext').style.display='';
  const cheer=document.getElementById('cheer');

  if(wonNow){
    playSuccess(); confetti(18);
    circle = new Set();
    /* The picture of this last word stays on screen. The party waits for "Siguiente". */
    pendingTrophy = true;
    cheer.textContent='¡Nivel completado! 🏆';
  }else if(lapDone){
    /* The fanfare plays now, so hurrying on to the next word cannot swallow it.
       Only the line is delayed, and renderWord cancels it. */
    playFanfare(); confetti(60);
    circle = new Set();
    lapTimer = setTimeout(()=>{ lapTimer=null; cheer.textContent='¡Vuelta completa! 🎉'; }, 700);
  }else{
    playSuccess(); confetti(18);
    cheer.textContent = pick(['¡Bravo! 🎉','¡Muy bien! 👏','¡Excelente! 🌟','¡Lo lograste! 🥳']);
  }
}
/* The segments follow the lap, not the stored stars: on a level the child has
   already won every word carries a star, so a bar drawn from the stars would sit
   full and never move while the child reads it again. Accepted limitation: when a
   level is finished across two sittings, the trophy comes from the stars and can
   fire before the segments fill. */
function updateLevelBar(){
  const lw=levelWords(curLevel);
  const bar=document.getElementById('levelbar');
  if(bar.childElementCount!==lw.length){
    bar.innerHTML='';
    for(let i=0;i<lw.length;i++){
      const s=document.createElement('span'); s.className='seg'; bar.appendChild(s);
    }
  }
  const done=lw.filter(x=>circle.has(x.w)).length;
  [...bar.children].forEach((s,i)=>s.classList.toggle('on', i<done));
}

/* =================== TROPHY =================== */
function showTrophy(){
  pendingTrophy = false;
  const level = curLevel;   /* the trophy itself was stored back in markRead */
  show('trophy');           /* no history entry: the party rides on the level's */

  const cup=document.getElementById('cup');
  const rays=document.getElementById('rays');
  const head=document.getElementById('trophyHead');
  const unlock=document.getElementById('trophyUnlock');
  const lock=document.getElementById('trophyLock');
  const unlockText=document.getElementById('trophyUnlockText');
  const row=document.getElementById('trophyRow');
  const go=document.getElementById('trophyGo');

  cup.textContent=TROPHIES[level-1];
  cup.classList.remove('pop'); void cup.offsetWidth; cup.classList.add('pop');
  rays.classList.remove('on'); head.classList.remove('on');
  unlock.classList.remove('on'); row.classList.remove('on');
  lock.classList.remove('shake');

  playTrophy(); confetti(90);
  setTimeout(()=>confetti(60), 700);
  setTimeout(()=>rays.classList.add('on'), 300);

  const allDone = prog.trophies.length>=LEVELS;
  head.textContent = allDone ? '¡Terminaste todo el juego! 🎉' : '¡Nivel '+level+' completado!';
  setTimeout(()=>head.classList.add('on'), 900);

  const next = level+1;
  if(next<=LEVELS){
    unlock.style.display='';
    unlockText.textContent='¡Se abre el nivel '+next+'!';
    go.style.display='';
    go.textContent='Nivel '+next+' →';
    setTimeout(()=>{
      unlock.classList.add('on'); lock.textContent='🔒'; lock.classList.add('shake');
      setTimeout(()=>{ lock.textContent='🔓'; playUnlock(); }, 700);
    }, 1300);
  }else{
    unlock.style.display='none';
    go.style.display='none';
  }
  setTimeout(()=>row.classList.add('on'), 2100);
}
/* The party sits on the level's history entry, so moving on replaces it: the
   stack stays two deep and "back" from the new level still lands on the map. */
function afterTrophy(){
  const next = curLevel+1;
  history.replaceState({screen:'game', level:next}, '');
  startLevel(next);
}

/* =================== ADULT'S PANEL =================== */
function openTools(){
  document.getElementById('easyMode').checked=easy;
  document.getElementById('sheetBg').classList.add('open');
}
function closeTools(e){
  if(e && e.target!==document.getElementById('sheetBg')) return;
  document.getElementById('sheetBg').classList.remove('open');
}
/* The adult's way in: hold the finger down. A child tapping never gets through. */
function holdTo(btn, fn){
  let timer=null;
  const start=()=>{ clearTimeout(timer); timer=setTimeout(fn, 800); };
  const stop=()=>{ clearTimeout(timer); timer=null; };
  btn.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(e=>btn.addEventListener(e, stop));
}
function toggleEasy(){
  easy=document.getElementById('easyMode').checked;
  if(current && onScreen('game')) renderWord();
}
function resetProgress(){
  if(confirm('¿Borrar todos los trofeos y empezar de nuevo?')){
    prog=blank(); save();
    circle=new Set(); circleLevel=null; pendingTrophy=false; curLevel=1;
    closeTools();
    /* From a level, step back onto the map entry already in the history. On the
       map there is nothing to step back to — one more step would leave the site. */
    if(onScreen('map')) renderMap(); else history.back();
  }
}

/* =================== CONFETTI =================== */
const cc=document.getElementById('confetti'); let cctx, parts=[], running=false;
function sizeC(){ cc.width=innerWidth; cc.height=innerHeight; }
addEventListener('resize',sizeC); sizeC(); cctx=cc.getContext('2d');
function confetti(n){
  for(let i=0;i<n;i++){ parts.push({x:Math.random()*cc.width,y:-20,vx:(Math.random()-.5)*4,vy:Math.random()*3+2,
    s:Math.random()*8+6,c:PALETTE[Math.random()*PALETTE.length|0],a:1,r:Math.random()*6}); }
  if(!running){ running=true; requestAnimationFrame(stepC); }
}
function stepC(){
  cctx.clearRect(0,0,cc.width,cc.height);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.a-=.008; p.r+=.1;
    cctx.save(); cctx.globalAlpha=Math.max(0,p.a); cctx.translate(p.x,p.y); cctx.rotate(p.r);
    cctx.fillStyle=p.c; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); cctx.restore(); });
  parts=parts.filter(p=>p.a>0 && p.y<cc.height+30);
  if(parts.length) requestAnimationFrame(stepC);
  else { running=false; cctx.clearRect(0,0,cc.width,cc.height); }
}

/* init */
(function(){
  const raw = new URLSearchParams(location.search).get('name');
  if(raw){ const nm = raw.trim().slice(0,24).replace(/[<>]/g,''); if(nm) document.getElementById('greet').textContent = '¡Hola, '+nm+'! 🌟'; }
  curLevel = firstOpenLevel();
  holdTo(document.getElementById('gearMap'), openTools);
  holdTo(document.getElementById('gearGame'), openTools);
  /* A reload inside a level stays in that level and keeps its history entry.
     Replacing it with the map would put two identical map entries in a row, and
     the back button would then look broken to the child. */
  const st = history.state;
  if(st && st.screen==='game' && unlocked(st.level)) startLevel(st.level);
  else { history.replaceState({screen:'map'}, ''); openMap(); }
})();
</script>
